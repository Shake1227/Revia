[package]
name = "revia"
version = "0.1.0"
description = "Scattered projects, one calm workspace."
authors = ["Shake_1227"]
license = "CC-BY-NC-4.0"
repository = "https://github.com/Shake1227/Revia"
edition = "2024"

[lib]
name = "revia_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
semver = "1"
trash = "5"
regex = "1"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
